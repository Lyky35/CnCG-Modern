name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          mingw-w64 mingw-w64-tools glslang-tools ninja-build cmake git

    - name: Configure CMake
      run: cmake -B build/windows-x64-mingw -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake

    - name: Build
      run: cmake --build build/windows-x64-mingw -j 4

    - name: Verify x64
      if: success()
      run: |
        x86_64-w64-mingw32-objdump -f build/windows-x64-mingw/bin/RTS.exe | grep -q "i386:x86-64"
        x86_64-w64-mingw32-objdump -p build/windows-x64-mingw/bin/RTS.exe | grep -q "vulkan-1.dll"

    - name: Package
      run: |
        mkdir -p dist
        cp build/windows-x64-mingw/bin/RTS.exe dist/
        for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
          src=$(find /usr -name "$dll" -path "*x86_64*" 2>/dev/null | head -1)
          if [ -z "$src" ]; then echo "missing $dll" >&2; exit 1; fi
          cp "$src" dist/
        done
        cp README.txt dist/ 2>/dev/null || true
        (cd dist && zip -qr ../RTS-vulkan-win64.zip .)

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: RTS-x64-vulkan
        path: RTS-vulkan-win64.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: RTS-vulkan-win64.zip
        generate_release_notes: true
