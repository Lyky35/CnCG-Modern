name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.4
      with:
        vulkan-sdk-version: '1.3.290.0'

    - name: Configure CMake
      run: cmake --preset windows-x64-msvc

    - name: Build
      run: cmake --build --preset windows-x64-msvc

    - name: Verify x64
      shell: pwsh
      run: |
        $dumpbin = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe"
        $dumpbinPath = (Resolve-Path $dumpbin -ErrorAction SilentlyContinue | Select-Object -First 1).Path
        if ($dumpbinPath) {
          & $dumpbinPath /headers build/windows-x64-msvc/bin/RTS.exe | Select-String "machine"
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RTS-x64
        path: build/windows-x64-msvc/bin/RTS.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/windows-x64-msvc/bin/RTS.exe
        generate_release_notes: true
